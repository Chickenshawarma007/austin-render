<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            line-height: 1.6;
        }

        header {
            background: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        .hero {
            background: #f4f4f4;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 40px;
        }

        .skills ul {
            list-style: none;
        }

        .skills li {
            background: #ddd;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
        }

        form {
            max-width: 400px;
            margin: auto;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    <h2>My Portfolio</h2>
    <nav>
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
        <a href="#feedback">Feedback</a>
    </nav>
</header>

<!-- Hero Section -->
<section id="hero" class="hero">
    <h1>Hello, I'm Austin</h1>
    <p>Web Developer | Student</p>
</section>

<!-- About Me -->
<section id="about">
    <h2>About Me</h2>
    <p>I am a student learning web development. I enjoy creating simple and clean websites.</p>
</section>

<!-- Skills -->
<section id="skills" class="skills">
    <h2>My Skills</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
</section>



<!-- FEEDBACK -->
<section id="feedback">
<div class="container card">
<h2 class="section-title">Feedback</h2>

<form class="feedback-form" id="feedbackForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea rows="4" id="message" placeholder="Your Feedback" required></textarea>
<button type="submit">Submit Feedback</button>
</form>

<div class="feedback-status" id="status"></div>
</div>
</section>

<footer style="text-align:center;padding:20px;color:var(--muted)">
</footer>

<script>
/* 🔗 SUPABASE CONFIG */
const supabaseUrl = "https://glvflgclgxtyvgzvwklv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdmZsZ2NsZ3h0eXZnenZ3a2x2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDIzMTQsImV4cCI6MjA5MDE3ODMxNH0.P5oraQQNX5IKf62wVNM8-C6RFEsMoIpZTxgQ2pgjFmE";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

/* 📨 FEEDBACK SUBMIT */
document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
e.preventDefault();

const status = document.getElementById("status");
status.innerText = "Submitting...";

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const message = document.getElementById("message").value;

const { error } = await supabaseClient
.from("feedbacks")
.insert([{ name, email, message }]);

if (error) {
status.innerText = "❌ Error submitting feedback";
status.style.color = "red";
} else {
status.innerText = "✅ Feedback submitted successfully!";
status.style.color = "#00d4ff";
e.target.reset();
}});
</script>

</body>
</html>
